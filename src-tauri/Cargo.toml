[package]
name = "wutavern"
version = "0.1.1"
description = "WuTavern launcher and installer"
authors = ["WuTavern contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "wutavern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "gzip", "rustls-tls", "rustls-tls-native-roots"] }
zip = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
